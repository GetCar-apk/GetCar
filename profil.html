<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;user-select:none;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#e8eaed}
.pg{position:fixed;inset:0;z-index:5;background:#fff;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:2px;padding:12px 8px;border-bottom:1px solid #f2f2f2;flex-shrink:0}
.hd-bk,.hd-ico{width:44px;height:44px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hd-bk:active,.hd-ico:active{opacity:.6}
.hd-tt{flex:1;text-align:center;font-size:20px;font-weight:800;color:#202124;padding-right:88px}
.bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
.sinkron{margin:10px 18px 0;font-size:12px;color:#5f6368;display:flex;align-items:center;gap:7px}
.sinkron .dot{width:8px;height:8px;border-radius:50%;background:#f7b500;flex-shrink:0;animation:denyut 1.2s infinite}
.sinkron.ok .dot{background:#00b14f;animation:none}
.sinkron.err .dot{background:#ea4335;animation:none}
@keyframes denyut{0%,100%{opacity:1}50%{opacity:.35}}
.pf-top{display:flex;align-items:center;gap:16px;padding:20px 18px 14px}
.pf-foto{width:82px;height:82px;border-radius:50%;background:#eef1f3 center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pf-tx{flex:1;min-width:0}
.pf-nama{font-size:23px;font-weight:800;color:#202124;line-height:1.25;word-wrap:break-word}
.pf-meta{font-size:15px;color:#5f6368;margin-top:6px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.pf-meta .pisah{color:#dadce0;flex-shrink:0}
.pf-meta span:not(.pisah){overflow:hidden;text-overflow:ellipsis}
.reg-sec{margin:6px 16px 10px;background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:16px}
.reg-sec h4{font-size:16px;font-weight:800;color:#202124;margin-bottom:2px}
.reg-jml{font-size:12px;color:#9aa0a6;margin-bottom:8px}
.reg-r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #f4f4f4;font-size:14px}
.reg-r:last-child{border-bottom:none}
.reg-r .k{color:#5f6368;flex-shrink:0;max-width:45%}
.reg-r .v{color:#202124;font-weight:600;text-align:right;word-break:break-word;flex:1}
.reg-r .v.hijau{color:#00b14f}
.pf-kartu{margin:6px 16px 10px;background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:18px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;width:calc(100% - 32px);font-family:inherit;text-align:left}
.pf-kartu:active{background:#fafafa}
.pf-kartu-tx{flex:1;min-width:0}
.pf-kartu-tx b{display:block;font-size:19px;font-weight:800;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-kartu-tx small{display:block;font-size:15px;color:#5f6368;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-rate{padding:16px 18px 4px}
.pf-rate-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pf-rate-judul{flex:1;min-width:0;font-size:18px;font-weight:800;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-updated{font-size:13px;color:#5f6368;flex-shrink:0}
.pf-rate-grid{display:flex;align-items:center;gap:16px;margin-top:12px}
.pf-nilai{text-align:center;min-width:88px;flex-shrink:0}

.pf-bars{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}

.pf-bar-row>span:first-child{width:10px;text-align:center}

.pf-tabs{display:flex;margin-top:14px;border-bottom:2px solid #eee}
.pf-tab{flex:1;background:none;border:none;padding:14px 0;font-size:18px;font-weight:700;color:#5f6368;cursor:pointer;position:relative;font-family:inherit}

.pf-lencana{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}

.pf-lihat{background:none;border:none;color:#1a73e8;font-size:16px;font-weight:700;padding:10px 0 4px;cursor:pointer;font-family:inherit}

.pf-u-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pf-u-top b{color:#202124;font-size:15px}

.r{background:#fff;border:1px solid #f0f0f0;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:#202124;text-align:left}

.r b{color:#00b14f}
.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;z-index:7;display:flex;border-top:1px solid #eee}
.nav a{flex:1;color:#5f6368;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-decoration:none}
.nav a span{max-width:70px;overflow:hidden;text-overflow:ellipsis}
.nav a.aktif{color:#00b14f;font-weight:700}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.modal.tampil{opacity:1;pointer-events:auto}
.modal-card{background:#fff;border-radius:20px;padding:22px;width:85%;max-width:330px;text-align:center;transform:scale(.95);transition:.2s;max-height:80%;overflow:auto}
.modal.tampil .modal-card{transform:scale(1)}
.modal-card h3{color:#202124;margin-bottom:8px}
.m-in{width:100%;margin-top:14px;padding:12px 14px;font-size:16px;font-weight:600;border:2px solid #dadce0;border-radius:12px;color:#202124;outline:none;font-family:inherit;text-align:left}
.m-in:focus{border-color:#00b14f}
.m-btn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;background:#f1f3f4;color:#202124;font-weight:700;cursor:pointer;font-family:inherit}
.m-btn.hijau{background:#00b14f;color:#fff}
.catatan{font-size:11px;color:#9aa0a6;text-align:center;margin-top:10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);z-index:99;background:rgba(32,33,36,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.tampil{opacity:1;transform:translate(-50%,0)}
@media (max-width:370px){.pf-nilai b{font-size:32px}}
@media (min-width:600px){

  .pg{left:50%;margin-left:-175px;width:350px;right:auto;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.55)}
}
</style>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('tampil');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('tampil'),2200)}
function modal(j,html){$('mJudul').textContent=j;$('mIsi').innerHTML=html;$('modal').classList.add('tampil')}
 $('mTutup').addEventListener('click',()=>$('modal').classList.remove('tampil'));
 $('bkHome').addEventListener('click',()=>location.href='index.html');

/* ================= FIREBASE — sama dengan admin ================= */
const firebaseConfig={apiKey:"AIzaSyD3FQbFF5a91MlASpqImTMmGkYvaTcdxm0",authDomain:"kadek-ed34e.firebaseapp.com",databaseURL:"https://kadek-ed34e-default-rtdb.firebaseio.com",projectId:"kadek-ed34e",storageBucket:"kadek-ed34e.firebasestorage.app",messagingSenderId:"65756136303",appId:"1:65756136303:web:6dbe5bc658fadb05ca1e9a"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* ================= STATE ================= */
const KEY='gc_profil';
let pfData=null;try{pfData=JSON.parse(localStorage.getItem(KEY))}catch(_){pfData=null}
let fbRef=null,kunciAktif=null,scanSedang=false,pickerDibuka=false;
let debugInfo={identitas:null,jumlah:0,cocok:0};

function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
function dariObj(k){let o=null;try{o=JSON.parse(lsGet(k)||'null')}catch(_){}return (o&&typeof o==='object')?o:null}
const normDg=t=>String(t==null?'':t).replace(/\D/g,'');
const fmtTelp=t=>{const n=normDg(t);return n?'+'+n:'—'};
const tampilNama=n=>(!n||!String(n).trim()||String(n).trim()==='-')?'(Belum isi nama)':String(n);

/* ================= IDENTITAS ================= */
const LS_OBJ=['gc_driver','gc_driver_data','gc_login','gc_sesi','gc_session','gc_user','gc_akun','driver','driverData','driver_data','loginData','login_data','userData','user_data','sesi','session','akun','user'];
function pengenal(){
  const p=new URLSearchParams(location.search);
  const r={id:null,telepon:null,email:null,nama:null};
  r.id=p.get('id')||p.get('driverId')||lsGet('gc_driver_id')||lsGet('driverId')||lsGet('uid')||null;
  r.telepon=p.get('telp')||p.get('telepon')||p.get('hp')||lsGet('gc_telepon')||null;
  r.nama=p.get('nama')||lsGet('gc_driver_nama')||null;
  for(const k of LS_OBJ){
    const o=dariObj(k);if(!o)continue;
    if(!r.id)for(const f of['id','uid','driverId','userId'])if(o[f]!=null&&String(o[f]).trim()!==''){r.id=String(o[f]);break}
    if(!r.telepon)for(const f of['telepon','telp','hp','phone','noHp','noTelp','whatsapp','wa','no_hp','no_telp'])if(o[f]!=null&&String(o[f]).trim()!==''){r.telepon=String(o[f]);break}
    if(!r.email&&o.email&&String(o.email).trim()!=='')r.email=String(o.email);
    if(!r.nama)for(const f of['nama','name','namaLengkap','nama_lengkap'])if(o[f]&&String(o[f]).trim()!=='-'){r.nama=String(o[f]);break}
  }
  if(!r.telepon&&pfData&&pfData.telepon)r.telepon=String(pfData.telepon);
  if(!r.nama&&pfData&&(pfData.nama||pfData.name))r.nama=String(pfData.nama||pfData.name);
  return r;
}
function samaTelp(a,b){
  const x=normDg(a),y=normDg(b);
  if(!x||!y)return false;
  if(x===y)return true;
  const len=Math.min(x.length,y.length);
  if(len>=10)return x.slice(-10)===y.slice(-10);
  if(len>=9)return x.slice(-9)===y.slice(-9);
  return false;
}
function cocok(v,key,c){
  if(!v||typeof v!=='object')return false;
  if(c.id&&(String(key)===String(c.id)||['id','uid','driverId','userId'].some(f=>v[f]!=null&&String(v[f])===String(c.id))))return true;
  if(c.telepon){const ct=normDg(c.telepon);
    if(ct&&['telepon','telp','hp','phone','noHp','noTelp','whatsapp','wa','no_hp','no_telp'].some(f=>samaTelp(v[f],ct)))return true}
  if(c.email&&String(v.email||'').toLowerCase()===String(c.email).toLowerCase())return true;
  if(c.nama&&String(v.nama||v.name||'').toLowerCase()===String(c.nama).toLowerCase())return true;
  return false;
}

/* ================= STATUS ================= */
function updateStatus(mode,txt){
  const el=$('pfSinkron');
  if(mode==='ok'){el.className='sinkron ok';el.innerHTML='<span class="dot"></span>Tersambung Firebase — '+esc(txt)}
  else if(mode==='cari'){el.className='sinkron';el.innerHTML='<span class="dot"></span>Mencari data Anda di Firebase… ('+debugInfo.jumlah+' pendaftar diperiksa)'}
  else if(mode==='tidak'){el.className='sinkron err';el.innerHTML='<span class="dot"></span>Akun belum terpilih — ketuk di sini untuk pilih akun'}
  else if(mode==='perm'){el.className='sinkron err';el.innerHTML='<span class="dot"></span>Akses ditolak Rules Firebase — ketuk untuk info'}
  else if(mode==='putus'){el.className='sinkron err';el.innerHTML='<span class="dot"></span>Terputus dari Firebase — periksa internet'}
  else{el.className='sinkron';el.innerHTML='<span class="dot"></span>Menghubungkan Firebase…'}
}

/* ================= timestamp dari push-ID ================= */
const PUSH_CHARS='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
function tsDariId(id){try{let bin='';for(let i=0;i<8;i++){const idx=PUSH_CHARS.indexOf(String(id)[i]);if(idx<0)return 0;bin+=idx.toString(2).padStart(6,'0')}return parseInt(bin,2)}catch(_){return 0}}
function fmtBulan(v){
  if(v==null||v==='')return null;
  const t=typeof v==='number'?v:Date.parse(v);
  if(isNaN(t))return null;
  return new Date(t).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}
const bersihKey=s=>String(s).replace(/[.#$/\[\]]/g,'_');

/* ================= LANGGANAN REALTIME ================= */
function terapkan(v){
  if(!v||typeof v!=='object')return;
  pfData=Object.assign({},pfData||{},v);
  pfData.id=pfData.id||kunciAktif;
  try{localStorage.setItem(KEY,JSON.stringify(pfData))}catch(_){}
  if(pfData.telepon)lsSet('gc_telepon',String(pfData.telepon));
  if(pfData.nama)lsSet('gc_driver_nama',String(pfData.nama));
  render();
}
function langganan(path){
  if(fbRef)return;
  kunciAktif=path.split('/').pop();
  fbRef=db.ref(path);
  updateStatus('ok','pendaftaran/'+kunciAktif);
  fbRef.on('value',s=>{if(s.exists())terapkan(s.val())},err=>updateStatus('perm',err.code));
}

/* ================= PENCARIAN OTOMATIS ================= */
const NODE_CARI=['pendaftaran','drivers','driver','users'];
const BOBOT={aktif:100,disetujui:80,proses:40,perlu_perbaikan:30,belum_otp:20,suspend:10,ditolak:5,ditolak_duplikat:0};
const bobot=s=>BOBOT[String(s||'').toLowerCase()]||25;

function pindai(){
  if(scanSedang||fbRef)return;
  const c=pengenal();
  debugInfo.identitas=c;
  if(!c.id&&!c.telepon&&!c.email&&!c.nama){
    updateStatus('tidak');
    if(!pickerDibuka){pickerDibuka=true;setTimeout(bukaPilihAkun,400)}
    return;
  }
  scanSedang=true;updateStatus('cari');
  const kandidat=[];let sisa=NODE_CARI.length,perm=false;
  NODE_CARI.forEach(n=>{
    db.ref(n).limitToLast(2000).once('value').then(s=>{
      let jml=0;
      if(s.exists())s.forEach(ch=>{jml++;const v=ch.val();if(cocok(v,ch.key,c))kandidat.push({node:n,key:ch.key,v})});
      if(n==='pendaftaran')debugInfo.jumlah=jml;
    }).catch(err=>{if(String(err&&(err.code||err.message||'')).toUpperCase().indexOf('PERMISSION')>=0)perm=true})
      .then(()=>{
        if(--sisa===0){
          scanSedang=false;debugInfo.cocok=kandidat.length;
          if(fbRef)return;
          if(kandidat.length){
            kandidat.sort((a,b)=>bobot(b.v.status)-bobot(a.v.status)||tsDariId(b.key)-tsDariId(a.key));
            const t=kandidat[0];
            lsSet('gc_driver_id',t.key);
            if(t.v&&t.v.telepon)lsSet('gc_telepon',String(t.v.telepon));
            if(t.v&&t.v.nama)lsSet('gc_driver_nama',String(t.v.nama));
            langganan(t.node+'/'+t.key);
          }else{
            updateStatus(perm?'perm':'tidak');
            if(!perm&&!pickerDibuka){pickerDibuka=true;setTimeout(bukaPilihAkun,400)}
          }
        }
      });
  });
}
function mulaiFirebase(){
  updateStatus('tunggu');
  db.ref('.info/connected').on('value',s=>{if(!s.val()&&!fbRef&&!scanSedang)updateStatus('putus')});
  const c=pengenal();
  debugInfo.identitas=c;
  if(c.id){
    const k=bersihKey(c.id);
    db.ref('pendaftaran/'+k).on('value',s=>{if(s.exists()&&!fbRef)langganan('pendaftaran/'+k)},()=>{});
    setTimeout(()=>{if(!fbRef)pindai()},1500);
  }else if(c.telepon||c.email||c.nama){
    pindai();
  }else{
    updateStatus('tidak');
    if(!pickerDibuka){pickerDibuka=true;setTimeout(bukaPilihAkun,400)}
  }
}

/* ================= PILIH AKUN (dari daftar — paling pasti) ================= */
function bukaPilihAkun(){
  modal('Pilih Akun Anda','<div class="kosong" id="paLoad" style="padding:12px 0">Memuat daftar pendaftar…</div>');
  db.ref('pendaftaran').limitToLast(30).once('value').then(s=>{
    if(!$('paLoad'))return;
    if(!s.exists()){$('paLoad').textContent='Belum ada pendaftar di node "pendaftaran". Daftar dulu lewat aplikasi driver.';return}
    const arr=[];s.forEach(ch=>arr.push({key:ch.key,v:ch.val()}));
    arr.sort((a,b)=>(Number(a.v&&a.v.dibuat)||tsDariId(a.key))<(Number(b.v&&b.v.dibuat)||tsDariId(b.key))?1:-1);
    let html='<div class="kosong" style="text-align:left;padding:2px 0 6px">Ketuk akun Anda (nama & No. HP yang dipakai saat mendaftar):</div>';
    html+=arr.map(x=>{
      const v=x.v||{};
      const st=String(v.status||'belum_otp').replace(/_/g,' ');
      return '<button class="m-btn pa-item" data-key="'+esc(x.key)+'" style="margin-top:8px;text-align:left"><b style="font-size:15px">'+esc(tampilNama(v.nama))+'</b><br><span style="font-weight:600;font-size:13px;color:#5f6368">'+esc(fmtTelp(v.telepon))+' · '+esc(st)+'</span></button>';
    }).join('');
    html+='<button class="m-btn" id="paCari" style="margin-top:14px">Cari dengan No. HP</button>';
    $('mIsi').innerHTML=html;
    $('mIsi').querySelectorAll('.pa-item').forEach(b=>b.addEventListener('click',()=>{
      const key=b.getAttribute('data-key');
      const x=arr.find(a=>a.key===key);
      lsSet('gc_driver_id',key);
      if(x&&x.v){
        if(x.v.telepon)lsSet('gc_telepon',String(x.v.telepon));
        if(x.v.nama)lsSet('gc_driver_nama',String(x.v.nama));
      }
      $('modal').classList.remove('tampil');
      langganan('pendaftaran/'+key);
      toast('Akun dipilih — memuat data…');
    }));
    $('paCari').addEventListener('click',modalIdentitas);
  }).catch(e=>{if($('paLoad'))$('paLoad').textContent='Gagal memuat daftar: '+e.message});
}
function modalIdentitas(){
  modal('Cari Data Saya',
    '<div class="catatan" style="text-align:left;font-size:13px;color:#5f6368;margin:4px 0 0">No. HP yang Anda pakai saat mendaftar (harus sama dengan yang terlihat di panel admin):</div>'+
    '<input class="m-in" id="miTelp" inputmode="tel" placeholder="08xxxxxxxxxx" value="'+esc(lsGet('gc_telepon')||'')+'">'+
    '<div class="catatan" style="text-align:left;font-size:13px;color:#5f6368;margin:10px 0 0">Nama lengkap (opsional):</div>'+
    '<input class="m-in" id="miNama" placeholder="Nama sesuai pendaftaran" value="'+esc(lsGet('gc_driver_nama')||'')+'">'+
    '<button class="m-btn hijau" id="miCari">Cari & Tampilkan Data Saya</button>');
  $('miCari').addEventListener('click',()=>{
    const tp=normDg($('miTelp').value),nm=$('miNama').value.trim();
    if(tp.length<9){toast('No. HP tidak valid');return}
    lsSet('gc_telepon',tp);
    if(nm)lsSet('gc_driver_nama',nm);
    $('modal').classList.remove('tampil');
    pickerDibuka=true;
    pindai();
  });
}
 $('pfSinkron').addEventListener('click',()=>{
  if(fbRef){
    modal('Status Sinkron','<p class="kosong" style="text-align:left;line-height:1.7">Tersambung ke: <b>pendaftaran/'+esc(kunciAktif||'')+'</b><br>Untuk ganti akun, ketuk ikon (?) di kanan atas → "Ganti / Pilih Akun".</p>');
  }else{
    bukaPilihAkun();
  }
});

/* ================= SIMPAN DUA ARAH ================= */
function simpanProfil(patch){
  pfData=Object.assign({},pfData||{},patch);
  try{localStorage.setItem(KEY,JSON.stringify(pfData))}catch(_){}
  render();
  if(fbRef){
    fbRef.update(patch)
      .then(()=>toast('Tersimpan & tersinkron ke Firebase ✓'))
      .catch(e=>toast('Gagal ke Firebase: '+e.message));
  }else{
    toast('Tersimpan lokal (Firebase belum tertaut)');
  }
}

/* ================= RENDER ================= */
const ICO_ORANG='<svg viewBox="0 0 24 24" width="46" height="46"><circle cx="12" cy="8.2" r="3.7" fill="#b9bec4"/><path d="M12 13.4c-4.1 0-6.8 2.5-6.8 6.1v.7h13.6v-.7c0-3.6-2.7-6.1-6.8-6.1z" fill="#b9bec4"/></svg>';
const SKIP_REG={foto:1,photo:1,fotoUrl:1,avatar:1,password:1,pass:1,sandi:1,kataSandi:1,pin:1,token:1,fcm:1,fcmToken:1,lencana:1,ulasan:1,reviews:1,distribusi:1,perbaikan:1,rating:1,jumlahOrder:1,updated:1,updatedAt:1,lastUpdate:1,otp:1,otpDikirim:1,passwordDikirim:1,itemPerbaikan:1,catatanPerbaikan:1,alasanDitolak:1,riwayat:1,dokumen:1,waktuPerbaikan:1};
const LABELS={nama:'Nama Lengkap',name:'Nama Lengkap',namaLengkap:'Nama Lengkap',telepon:'No. Telepon',telp:'No. Telepon',hp:'No. Telepon',phone:'No. Telepon',noHp:'No. Telepon',noTelp:'No. Telepon',whatsapp:'WhatsApp',wa:'WhatsApp',email:'Email',alamat:'Alamat',domisili:'Domisili',nik:'NIK',ktp:'No. KTP',noKtp:'No. KTP',sim:'No. SIM',noSim:'No. SIM',jenisSim:'Jenis SIM',masaBerlakuSim:'SIM Berlaku Hingga',platNomor:'Plat Nomor',plat:'Plat Nomor',noPolisi:'Plat Nomor',nopol:'Plat Nomor',mobil:'Mobil / Kendaraan',jenisKendaraan:'Jenis Kendaraan',kendaraan:'Kendaraan',merek:'Merek',merk:'Merek',tipe:'Tipe',model:'Model',warna:'Warna',tahun:'Tahun',transmisi:'Transmisi',bank:'Bank',noRek:'No. Rekening',rekening:'No. Rekening',namaRek:'Nama Rekening',namaBank:'Nama Bank',tanggalLahir:'Tanggal Lahir',tglLahir:'Tanggal Lahir',lahir:'Tanggal Lahir',tanggalDaftar:'Tanggal Daftar',tglDaftar:'Tanggal Daftar',createdAt:'Tanggal Daftar',dibuat:'Tanggal Daftar',status:'Status',statusAkun:'Status Akun',darurat:'Kontak Darurat',kontakDarurat:'Kontak Darurat',id:'ID Driver',uid:'ID Driver',driverId:'ID Driver',gender:'Jenis Kelamin',jenisKelamin:'Jenis Kelamin',wilayah:'Wilayah',area:'Area Operasional',referral:'Kode Referal',referal:'Kode Referal',catatan:'Catatan'};
function flatten(o,pre,acc){
  Object.keys(o||{}).forEach(k=>{
    const v=o[k],key=pre?pre+'.'+k:k;
    if(key==='dokumen')return;
    if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,key,acc);
    else acc.push([key,Array.isArray(v)?v.filter(x=>x!=null&&x!=='').join(', '):v]);
  });
  return acc;
}
function rapi(k){return k.replace(/[._]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim().replace(/^./,c=>c.toUpperCase())}
function label(k){const leaf=k.split('.').pop();return LABELS[leaf]||LABELS[k]||rapi(leaf)}
function isImgValue(s){
  if(typeof s!=='string')return false;
  const t=s.trim();
  if(!t)return false;
  if(/^(data:image|https?:\/\/|blob:)/i.test(t))return true;
  const b=t.replace(/[\s\r\n]+/g,'');
  return b.length>100&&/^[A-Za-z0-9+/=]+$/.test(b);
}
function fmtVal(k,v){
  if(v==null||v==='')return null;
  if(typeof v==='boolean')return v?'Ya':'Tidak';
  const s=String(v).trim();
  if(!s||s==='-'||s==='null'||s==='undefined')return null;
  if(isImgValue(s))return null;
  if(s.length>120)return null;
  if(k==='status'||k.endsWith('.status'))return s.replace(/_/g,' ');
  if(/tanggal|tgl|lahir|created|dibuat|daftar|dob/i.test(k)&&/\d{4}/.test(s)){const t=Date.parse(s);if(!isNaN(t))return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
  if(typeof v==='number'&&v>1e12&&/waktu|time|timestamp|dibuat/i.test(k))return new Date(v).toLocaleString('id-ID');
  return s;
}
function renderRegistrasi(d){
  const flat=flatten(d,'',[]).filter(([k])=>{const leaf=k.split('.').pop();return !SKIP_REG[leaf]&&!SKIP_REG[k]});
  const rows=flat.map(([k,v])=>{
    const t=fmtVal(k,v);
    if(t===null)return '';
    const leaf=k.split('.').pop();
    const hijau=(leaf==='status'&&/aktif|active|approved|disetujui|verified/i.test(t))?' hijau':'';
    return '<div class="reg-r"><span class="k">'+esc(label(k))+'</span><span class="v'+hijau+'">'+esc(t)+'</span></div>';
  }).filter(Boolean);
  $('pfRegJml').textContent=rows.length?rows.length+' data tersinkron dari Firebase':'';
  $('pfReg').innerHTML=rows.length?rows.join(''):'<div class="kosong">Belum ada data registrasi dari Firebase.</div>';
}
function render(){
  const d=pfData||{};
  $('pfNama').textContent=d.nama||d.name||'—';
  $('pfGabung').textContent='Gabung bulan '+(d.gabung||fmtBulan(d.dibuat||d.tanggalDaftar||d.createdAt||tsDariId(kunciAktif))||'—');
  $('pfId').textContent=d.id||d.uid||d.driverId||kunciAktif||'—';
  const fotoSrc=d.foto||d.selfie||d.foto_profil||d.fotoProfil||d.foto_diri||'';
  const foto=$('pfFoto');
  if(fotoSrc&&isImgValue(fotoSrc)){foto.style.backgroundImage='url("'+fotoSrc+'")';foto.innerHTML=''}
  else{foto.style.backgroundImage='none';foto.innerHTML=ICO_ORANG}
  const dist=Object.assign({5:0,4:0,3:0,2:0,1:0},d.distribusi||{});
  const total=d.jumlahOrder||Object.values(dist).reduce((a,b)=>a+(Number(b)||0),0);
  $('pfRateJudul').textContent=total+' orderan terakhir yang dinilai';
  $('pfUpdated').textContent=d.updated?('Updated '+d.updated):'';
  $('pfNilai').textContent=Number(d.rating||0).toFixed(2);
  const max=Math.max(1,...Object.values(dist).map(Number));
  $('pfBars').innerHTML=[5,4,3,2,1].map(n=>'<div class="pf-bar-row"><span>'+n+'</span><div class="pf-bar-track"><div class="pf-bar-fill" style="width:'+((Number(dist[n])||0)/max*100)+'%"></div></div><span class="pf-bar-n">'+(dist[n]||0)+'</span></div>').join('');
  const lc=Array.isArray(d.lencana)?d.lencana:Object.values(d.lencana||{});
  $('pfLencana').innerHTML=lc.length?lc.map(l=>'<div class="pf-lc"><div class="pf-lc-ic" style="background:'+esc(l.warna||'#eceff1')+'">'+esc(l.ikon||'🏅')+'<span class="pf-lc-n">'+Number(l.jumlah||0)+'</span></div><span class="l">'+esc(l.judul)+'</span></div>').join(''):'<div class="kosong">Belum ada lencana.</div>';
  const ul=Array.isArray(d.ulasan)?d.ulasan:Object.values(d.ulasan||{});
  $('pfUlasan').innerHTML=ul.length?ul.map(u=>'<div class="pf-u"><div class="pf-u-top"><b>'+esc(u.nama||'Penumpang')+'</b><span class="pf-u-star">'+'★'.repeat(Math.min(5,Math.max(0,u.bintang||5)))+'</span></div><div class="pf-u-teks">'+esc(u.teks||'')+'</div></div>').join(''):'<div class="kosong">Belum ada ulasan penumpang.</div>';
  if(d.perbaikan)$('pfPerbaikan').textContent=d.perbaikan;
  renderRegistrasi(d);
}

/* ================= AKSI ================= */
 $('pfEdit').addEventListener('click',()=>{
  const d=pfData||{};
  const fld=(l,id,v,ph)=>'<div class="catatan" style="text-align:left;font-size:13px;color:#5f6368;margin:10px 0 0">'+l+'</div><input class="m-in" id="'+id+'" value="'+esc(v||'')+'" placeholder="'+ph+'">';
  modal('Edit Profil',
    fld('Nama Lengkap','efNama',d.nama||d.name,'Nama lengkap')+
    fld('No. Telepon','efTelp',d.telepon||d.hp||d.phone,'08xxxxxxxxxx')+
    fld('Alamat','efAlamat',d.alamat,'Alamat domisili')+
    fld('URL Foto','efFoto',d.foto,'https://...')+
    '<div class="catatan">Perubahan langsung terlihat di panel admin (realtime)</div>'+
    '<button class="m-btn hijau" id="efSimpan">Simpan</button>');
  $('efSimpan').addEventListener('click',()=>{
    const nm=$('efNama').value.trim(),tp=$('efTelp').value.trim(),al=$('efAlamat').value.trim(),ft=$('efFoto').value.trim();
    const ada=list=>{for(const k of list)if(k in (pfData||{}))return k;return list[0]};

    patch[ada(['telepon','hp','phone','noHp','noTelp'])]=tp;
    patch[ada(['alamat','domisili'])]=al;
    patch[ada(['foto','selfie','fotoUrl'])]=ft;
    simpanProfil(patch);
    $('modal').classList.remove('tampil');
  });
});
 $('pfBantuan').addEventListener('click',()=>{

    '<div class="catatan" style="line-height:1.6">Admin menampilkan SEMUA pendaftar, sedangkan halaman ini harus tahu akun mana milik Anda. Gunakan "Pilih Akun" bila data tidak muncul otomatis.</div>');
  $('dgPilih').addEventListener('click',()=>{pickerDibuka=false;bukaPilihAkun()});
});
 $('pfSafety').addEventListener('click',()=>{
  modal('Laporan Keselamatan',
    '<div class="r"><span>Total perjalanan</span><b style="color:#202124">'+((pfData&&pfData.jumlahOrder)||0)+'</b></div>'+
    '<div class="r"><span>Insiden tercatat</span><b style="color:#00b14f">0</b></div>'+
    '<div class="catatan">Data keselamatan dari server akan tampil di sini</div>');
});
 $('pfLihatSemua').addEventListener('click',()=>{
  const d=pfData||{};
  const lc=Array.isArray(d.lencana)?d.lencana:Object.values(d.lencana||{});
  modal('Semua Lencana',lc.length?lc.map(l=>'<div class="r"><div style="font-size:22px;width:30px;flex-shrink:0">'+esc(l.ikon||'🏅')+'</div><div style="min-width:0;flex:1"><b style="color:#202124">'+esc(l.judul)+'</b><div class="sub" style="font-size:12px;color:#5f6368">'+l.jumlah+' kali pujian</div></div></div>').join(''):'<div class="kosong">Belum ada lencana.</div>');
});
 $('tabPencapaian').addEventListener('click',()=>{$('tabPencapaian').classList.add('aktif');$('tabPerbaikan').classList.remove('aktif');$('isiPencapaian').style.display='';$('isiPerbaikan').style.display='none'});
 $('tabPerbaikan').addEventListener('click',()=>{$('tabPerbaikan').classList.add('aktif');$('tabPencapaian').classList.remove('aktif');$('isiPerbaikan').style.display='';$('isiPerbaikan').style.display='none'});

render();
mulaiFirebase();
</script>
